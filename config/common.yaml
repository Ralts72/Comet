# Comet 共享运行配置

vulkan:
  # 表面格式: bgra8_srgb, bgra8_unorm, rgba8_srgb, rgba8_unorm
  surface_format: bgra8_srgb
  color_space: srgb_nonlinear
  # 深度格式: d32_float, d24_unorm_s8_uint, d32_float_s8_uint
  depth_format: d32_float
  # 呈现模式: immediate（不等待垂直同步）, mailbox, fifo（垂直同步）, fifo_relaxed
  present_mode: immediate
  swapchain_image_count: 3
  # MSAA 采样数 (1, 2, 4, 8, 16, 32, 64)
  msaa_samples: 4

render:
  # 启动时选择 sdr / hdr / auto；hdr 和 auto 优先扩展线性输出，不支持时回退 SDR。
  # 编辑器暂时强制 SDR。切换后需重启，不会修改操作系统的 HDR 设置。
  output_mode: auto
  # HDR 输出峰值相对于 SDR 白色的倍数（1..16），不是显示器检测结果。
  hdr_headroom: 4
  # CPU 可并行准备的帧槽位数量
  max_frames_in_flight: 2
  # 期望的各向异性过滤倍率；1 表示关闭，超过设备上限时会回退到支持的最大值
  max_anisotropy: 8

window:
  width: 960
  height: 720
  fullscreen: false
  resizable: true

# 资产导入的容量策略；修改后重启 app/编辑器。估算额度不是进程总内存上限。
assets:
  source_max_mib: 512
  texture_working_mib: 1024
  mesh_working_mib: 1024
  mesh_owner_inspect_kib: 64
  async:
    in_flight: 8
    queued: 128
    working_mib: 2048
  # Finder 拖入时单批源文件及依赖的暂存输入量与待办数量。
  external_file_mib: 512
  external_file_queue: 8

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      # GCC 的预编译头缓存需要这两个选项；实际头文件内容仍参与缓存校验。
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install dependencies
        id: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential ninja-build ccache pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev \
            mesa-common-dev libgl1-mesa-dev libglib2.0-dev \
            curl tar \
            libvulkan-dev vulkan-tools \
            xvfb mesa-vulkan-drivers vulkan-validationlayers
          echo "VULKAN_SDK=/usr" >> $GITHUB_ENV
          echo "compiler=$(c++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore compiler results
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu26-gcc${{ steps.toolchain.outputs.compiler }}-ccache-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ubuntu26-gcc${{ steps.toolchain.outputs.compiler }}-ccache-v2-

      - name: Configure CMake
        run: |
          ccache --zero-stats
          cmake --preset ci-release -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=OFF

      - name: Build project
        run: |
          jobs=$(nproc)
          if (( jobs > 4 )); then jobs=4; fi
          cmake --build --preset ci-release --parallel "$jobs"

      # 在测试前保存，测试失败不丢弃本轮编译结果。
      - name: Save compiler results
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Setup virtual display for GLFW tests
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          # 等待虚拟显示服务器就绪后再执行 GLFW 测试。
          sleep 3

      - name: Run tests
        run: |
          export DISPLAY=:99
          export CI=true
          ctest --preset ci-release --verbose --timeout 120
